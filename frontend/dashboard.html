<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GroundTruth AI - Analytics Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-dark text-light">
    <nav class="navbar">
        <div class="logo">🛡️ GroundTruth <span class="badge">AI</span></div>
        <div class="nav-links">
            <a href="/">Detector</a>
            <a href="/dashboard" class="active">Dashboard</a>
            <a href="/history">History</a>
            <a href="/docs" target="_blank">API Docs</a>
        </div>
    </nav>
    <main class="container">
        <header class="hero">
            <h1>System Evaluation Analytics</h1>
            <p>Totals from the detection history.</p>
        </header>

        <div class="grid-layout">
            <div class="card">
                <h3>Total Queries Checked</h3>
                <h1 id="stat-total" style="font-size: 3rem; color: var(--accent-blue); margin-top: 1rem;">--</h1>
            </div>
            <div class="card">
                <h3>Hallucination Rate</h3>
                <h1 id="stat-rate" style="font-size: 3rem; color: var(--accent-red); margin-top: 1rem;">--%</h1>
            </div>
            <div class="card">
                <h3>Verdict Breakdown</h3>
                <p id="stat-breakdown" style="margin-top: 1rem;">--</p>
            </div>
        </div>
        <p id="stat-error" style="color: #ef4444;"></p>
    </main>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if (!res.ok) {
                    const d = data && data.detail;
                    throw new Error((d && d.message) || `status ${res.status}`);
                }
                document.getElementById('stat-total').textContent = data.total_evaluations;
                document.getElementById('stat-rate').textContent = `${data.hallucination_rate}%`;
                document.getElementById('stat-breakdown').textContent =
                    `Supported: ${data.supported_count} · Hallucinated: ${data.hallucinated_count} · Insufficient evidence: ${data.insufficient_evidence_count}`;
            } catch (e) {
                document.getElementById('stat-error').textContent = `Could not load statistics: ${e.message}`;
            }
        }
        fetchStats();
    </script>
</body>
</html>
