name: CI / Automated Testing

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real PostgreSQL + pgvector so the vector path, unique constraints and concurrency tests run in CI.
    # The LLM is always mocked in tests; CI does not need Ollama.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: groundtruth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d groundtruth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/groundtruth_test
      USE_LLM: "false"

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install system dependencies for OCR & PDF parsing
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils tesseract-ocr

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Run test suite (SQLite + PostgreSQL)
      run: python -m pytest -q -rs
