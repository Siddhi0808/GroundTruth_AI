services:
  # Primary Vector Database with pgvector extension pre-installed
  db:
    image: pgvector/pgvector:pg16
    container_name: groundtruth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: groundtruth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Host port 5433 so it doesn't clash with a local PostgreSQL on 5432.
    # The app container reaches this DB over the compose network as db:5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groundtruth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GroundTruth AI FastAPI Application
  app:
    build: .
    container_name: groundtruth_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Same variable names as backend/config.py and .env.example.
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/groundtruth
      # Ollama runs on the host (not in this compose file). host.docker.internal resolves to the host on
      # Docker Desktop; the extra_hosts entry below makes it work on Linux too.
      - OLLAMA_URL=http://host.docker.internal:11434
      # In a container, a missing database should stop the app rather than silently use SQLite.
      - ALLOW_SQLITE_FALLBACK=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/documents:/app/data/documents

volumes:
  pgdata:
