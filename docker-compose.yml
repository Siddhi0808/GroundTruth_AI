version: '3.8'

services:
  # Primary Vector Database with pgvector extension pre-installed
  db:
    image: pgvector/pgvector:pg16
    container_name: groundtruth_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: groundtruth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d groundtruth"]
      interval: 5s
      timeout: 5s
      retries: 5

  # GroundTruth AI FastAPI Application
  app:
    build: .
    container_name: groundtruth_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/groundtruth
      - OLLAMA_HOST=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/documents:/app/data/documents

volumes:
  pgdata:
